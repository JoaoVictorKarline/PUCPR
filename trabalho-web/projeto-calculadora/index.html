<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título da Página</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="div-calculadora">
        <div id="numerotela">
            <h1>23</h1>
        </div>

        <div class="numeros-operadores">
            <div id="agruparnumeros">
                <div class="numero-linha">
                    <div class="numeros">
                        <button class="num" id="um">1</button>
                    </div>
                    <div class="numeros">
                        <button class="num" id="dois">2</button>
                    </div>
                    <div class="numeros">
                        <button class="num" id="tres">3</button>
                    </div>
                </div>
                
                <div class="numero-linha">
                    <div class="numeros">
                        <button class="num" id="quatro">4</button>
                    </div>
                    <div class="numeros">
                        <button class="num" id="cinco">5</button>
                    </div>
                    <div class="numeros">
                        <button class="num" id="seis">6</button>
                    </div>
                </div>

                <div class="numero-linha">
                    <div class="numeros">
                        <button class="num" id="sete">7</button>
                    </div>
                    <div class="numeros">
                        <button class="num" id="oito">8</button>
                    </div>
                    <div class="numeros">
                        <button class="num" id="nove">9</button>
                    </div>
                </div>
                <div class="numero-linha">
                    <div class="numeros">
                        <button class="num" id="zero">0</button>
                    </div>
                </div>
            </div>
            <div class="operadores">
                <div class="operador-linha">
                    <div class="operador">
                        <button class="operadorbotao">+</button>
                    </div>
                    <div>
                        <button class="operadorbotao">-</button>
                    </div>
                </div>
                <div class="operador-linha">
                    <div class="operador">
                        <button class="operadorbotao">*</button>
                    </div>
                    <div>
                        <button class="operadorbotao">/</button>
                    </div>
                </div>
                <div class="operador-linha">
                    <div class="operador">
                        <button class="operadorbotao" id="igual">=</button>
                    </div>
                </div>
            </div>
        </div>
        </div>
        
    </div>
    <script src="index.js"></script>
</body>
</html>
